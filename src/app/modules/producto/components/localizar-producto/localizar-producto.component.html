<div class="table-container">
  <div class="table-header">
    <div class="row">
      <h2>Localizar productos</h2>
    </div>

    <div class="row search-section">
      <mat-form-field class="filter-field">
        <mat-label>Nombre o códido del producto</mat-label>
        <input
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Búsqueda de productos"
          #input
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
    <!-- Id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef class="text-center">
        CÓDIGO PRODUCTO
      </th>
      <td mat-cell *matCellDef="let element">{{ element.id }}</td>
    </ng-container>

    <!-- Nombre Column -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef class="text-center">
        NOMBRE PRODUCTO
      </th>
      <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
    </ng-container>

    <!-- Descriction Column -->
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef class="text-center">DESCRIPCIÓN</th>
      <td mat-cell *matCellDef="let element">{{ element.descripcion }}</td>
    </ng-container>

    <!-- Stock Column -->
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef class="text-center">STOCK</th>
      <td mat-cell *matCellDef="let element">
        {{ element.cantidad_disponible }}
      </td>
    </ng-container>

    <!-- Ubicacion Column -->
    <ng-container matColumnDef="ubicacion">
      <th mat-header-cell *matHeaderCellDef class="text-center">UBICACIÓN</th>
      <td mat-cell *matCellDef="let element">{{ element.ubicacion }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
  </table>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 15, 25]"
    [pageSize]="10"
    showFirstLastButtons
    aria-label="Seleccionar página de productos"
  >
  </mat-paginator>
  <div class="row mt-4">
    <div class="col-12">
      <div class="d-flex gap-2 justify-content-end">
        <button
          type="button"
          mat-button
          (click)="onCancel()"
          class="action-btn_cancel"
        >
          <mat-icon>arrow_back</mat-icon>
          Volver a lista de productos registrados
        </button>
      </div>
    </div>
  </div>
</div>
